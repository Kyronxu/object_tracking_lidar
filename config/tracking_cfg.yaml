object_tracking_lidar:
  ros__parameters:
    # Maximum number of tracking objects
    max_tracking_objects: 6
    # Euclidean clustering parameters
    cluster_tolerance: 0.20
    min_cluster_size: 30
    max_cluster_size: 400
    # Kalman filter parameters
    kf_process_noise: 0.01
    kf_measurement_noise: 0.1
    # Topic configuration
    input_topic: "/lidar/points_raw"
    output_frame: "base_link"
    # Range filter parameters (axis bounds for input point cloud)
    range_min_x: -2.0
    range_max_x: 3.5
    range_min_y: -2.0
    range_max_y: 2.0
    range_min_z: -0.1
    range_max_z: 2.5
    # Voxel downsample filter parameters (leaf size in meters)
    voxel_size_x: 0.1
    voxel_size_y: 0.1
    voxel_size_z: 0.1
